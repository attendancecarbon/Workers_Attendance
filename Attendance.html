<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Worker Attendance</title>
  <style>
    body { font-family: Arial; padding: 20px; text-align: center; }
    input, button { padding: 10px; margin: 10px 0; width: 90%; max-width: 300px; }
    video { border: 1px solid #ccc; margin-bottom: 10px; }
    img { margin-top: 10px; border: 1px solid #ccc; }
    #status { font-weight: bold; margin-top: 15px; color: green; }
  </style>
</head>
<body>
<h2>Worker Attendance</h2>

<input id="workerId" placeholder="Enter Worker ID"><br>

<video id="camera" width="320" height="240" autoplay></video><br>
<button onclick="takeSelfie()">Take Selfie</button><br>

<canvas id="canvas" width="320" height="240" style="display:none;"></canvas>
<img id="selfiePreview" width="160" height="120"><br>

<button onclick="markAttendance()">Mark Attendance</button>

<div id="status"></div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbyfXhtXe686sDGWK9ls6GUh0LngDJBjrvlS8GBX80odOmZsnOKTl03GLobAhdbVwNrHcQ/exec"; // Replace with your deployed Apps Script URL
let selfieData = "";

// Start camera
const video = document.getElementById('camera');
navigator.mediaDevices.getUserMedia({ video: true })
.then(stream => { video.srcObject = stream; })
.catch(err => { alert("Camera access denied: " + err); });

// Take selfie
function takeSelfie() {
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
  selfieData = canvas.toDataURL('image/jpeg').split(',')[1]; // base64
  document.getElementById('selfiePreview').src = "data:image/jpeg;base64," + selfieData;
}

// Submit attendance
function markAttendance() {
  const workerId = document.getElementById("workerId").value;
  if (!workerId) { alert("Enter your ID"); return; }
  if (!selfieData) { alert("Take a selfie first"); return; }

  navigator.geolocation.getCurrentPosition(async pos => {
    const data = {
      workerId,
      lat: pos.coords.latitude,
      lng: pos.coords.longitude,
      selfie: selfieData
    };
    sendWithRetry(data);
  }, err => { alert("GPS error: " + err.message); });
}

// Retry with exponential backoff
async function sendWithRetry(data, attempt=1) {
  try {
    const res = await fetch(API_URL, {
      method: "POST",
      body: JSON.stringify(data)
    });
    const result = await res.json();
    if(result.result === "Success"){
      document.getElementById('status').innerText = "Attendance Successful ✅";
      // Close page after 2 seconds
      setTimeout(() => window.close(), 2000);
    } else {
      alert("Error: " + result.message);
    }
  } catch(err) {
    if (attempt < 5) setTimeout(() => sendWithRetry(data, attempt+1), 2000*attempt);
    else alert("Failed to send attendance, will retry later.");
  }
}
</script>
</body>
</html>
