<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CARBON Attendance</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; background: #f4f7f9; padding: 20px; }
    .header { text-align: center; margin-bottom: 25px; width: 100%; max-width: 380px; }
    .logo { width: 100%; height: auto; max-width: 300px; display: block; margin: 0 auto; }
    .sub-text { font-size: 12px; font-weight: bold; color: #555; margin-top: 10px; letter-spacing: 1px; }
    .card { background: white; padding: 25px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 100%; max-width: 380px; box-sizing: border-box; }
    input { width: 100%; padding: 15px; margin-bottom: 20px; border: 1px solid #ddd; border-radius: 10px; box-sizing: border-box; font-size: 16px; outline: none; }
    .video-container { width: 100%; background: #000; border-radius: 12px; overflow: hidden; margin-bottom: 20px; aspect-ratio: 4/3; }
    video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    .btn-group { display: flex; gap: 12px; }
    button { flex: 1; padding: 18px; border: none; border-radius: 10px; color: white; font-weight: bold; cursor: pointer; transition: 0.3s; }
    #loginBtn { background: #28a745; }
    #logoutBtn { background: #dc3545; }
    #status { margin-top: 20px; padding: 12px; border-radius: 8px; font-size: 14px; text-align: center; display: none; width: 100%; }
  </style>
</head>
<body>

  <div class="header">
    <img src="https://raw.githubusercontent.com/attendancecarbon/Workers_Attendance/main/36ac2e59-7e79-49bd-af4f-bab334e60066.png" alt="Carbon Logo" class="logo">>
    <div class="sub-text">CARBON ARCHITECTURE & CONTRACTING L.L.C</div>
  </div>

  <div class="card">
    <input type="text" id="workerId" placeholder="Enter Worker ID" autocomplete="off">
    <div class="video-container">
      <video id="video" autoplay playsinline muted></video>
    </div>
    <div class="btn-group">
      <button id="loginBtn" onclick="submitAttendance('login')">CLOCK IN</button>
      <button id="logoutBtn" onclick="submitAttendance('logout')">CLOCK OUT</button>
    </div>
    <div id="status"></div>
  </div>

  <canvas id="canvas" style="display:none;" width="400" height="300"></canvas>

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwIpS7nG5cJp0I3JUROfT2qmY9NHqn0i4MI37OzOJqwjKh93cdkgnMZxIa7c0El8YYQag/exec"; 
    const video = document.getElementById('video');
    const workerInput = document.getElementById('workerId');
    const statusBox = document.getElementById('status');

    // --- ID PERSISTENCE LOGIC ---
    window.onload = function() {
      const savedId = localStorage.getItem('carbon_worker_id');
      const savedDate = localStorage.getItem('carbon_save_date');
      const today = new Date().toDateString();

      // Clear ID if it's a new day
      if (savedDate !== today) {
        localStorage.removeItem('carbon_worker_id');
        localStorage.removeItem('carbon_save_date');
      } else if (savedId) {
        workerInput.value = savedId;
      }
    };

    navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
      .then(stream => video.srcObject = stream);

    function showStatus(msg, color, bg) {
      statusBox.innerText = msg;
      statusBox.style.color = color;
      statusBox.style.background = bg;
      statusBox.style.display = "block";
    }

    function submitAttendance(type) {
      const id = workerInput.value.trim();
      if(!id) { alert("Please enter Worker ID"); return; }

      // Store ID and Date locally
      localStorage.setItem('carbon_worker_id', id);
      localStorage.setItem('carbon_save_date', new Date().toDateString());

      showStatus("Syncing Location & Photo...", "#1a73e8", "#e8f0fe");

      navigator.geolocation.getCurrentPosition(pos => {
        const canvas = document.getElementById('canvas');
        canvas.getContext('2d').drawImage(video, 0, 0, 400, 300);
        const selfie = canvas.toDataURL('image/jpeg', 0.6);

        fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          body: JSON.stringify({
            workerId: id,
            type: type,
            lat: pos.coords.latitude,
            lng: pos.coords.longitude,
            selfieUrl: selfie
          })
        }).then(() => {
          showStatus("✅ Attendance Marked Successfully", "#1e7e34", "#e6f4ea");
          
          // Clear ID only after Logout
          if (type === 'logout') {
            localStorage.removeItem('carbon_worker_id');
            localStorage.removeItem('carbon_save_date');
            workerInput.value = "";
          }
          
          setTimeout(() => { statusBox.style.display = "none"; }, 4000);
        }).catch(() => {
          showStatus("❌ Error. Try again.", "#d93025", "#fce8e6");
        });
      }, err => { alert("Location Access Required!"); }, { enableHighAccuracy: true });
    }
  </script>
</body>
</html>
