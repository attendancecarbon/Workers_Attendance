<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CARBON Attendance</title>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #f4f7f9;
      padding: 20px;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
      max-width: 380px;
      width: 100%;
    }

    .logo {
      width: 100%;
      max-width: 260px;
    }

    .sub-text {
      font-size: 12px;
      font-weight: 600;
      color: #555;
      margin-top: 8px;
    }

    .card {
      background: white;
      padding: 18px;
      border-radius: 16px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 12px;
      border-radius: 10px;
      border: 1px solid #ddd;
      font-size: 16px;
    }

    .video-container {
      width: 100%;
      background: black;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 12px;
      aspect-ratio: 4/3;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }

    /* LOGIN / LOGOUT ROW */
    .btn-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    button {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 10px;
      color: white;
      font-weight: 600;
      cursor: pointer;
    }

    #loginBtn { background: #28a745; }
    #logoutBtn { background: #dc3545; }

    /* LEAVE BUTTON (CENTERED BELOW) */
    .leave-container {
      margin-top: 12px;
      width: 100%;
      display: flex;
      justify-content: center;
    }

    #leaveBtn {
      background: #6c757d;
      width: 70%;
      max-width: 260px;
    }

    #status {
      margin-top: 12px;
      padding: 10px;
      border-radius: 8px;
      text-align: center;
      display: none;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <div class="header">
    <img src="https://raw.githubusercontent.com/attendancecarbon/Workers_Attendance/main/36ac2e59-7e79-49bd-af4f-bab334e60066.png" class="logo">
    <div class="sub-text">CARBON ARCHITECTURE & CONTRACTING L.L.C</div>
  </div>

  <!-- CARD -->
  <div class="card">

    <input type="text" id="workerId" placeholder="Enter Worker ID">

    <div class="video-container">
      <video id="video" autoplay playsinline muted></video>
    </div>

    <!-- LOGIN / LOGOUT -->
    <div class="btn-group">
      <button id="loginBtn" onclick="submitAttendance('login')">CLOCK IN</button>
      <button id="logoutBtn" onclick="submitAttendance('logout')">CLOCK OUT</button>
    </div>

    <!-- LEAVE (CENTERED BELOW) -->
    <div class="leave-container">
      <button id="leaveBtn" onclick="submitAttendance('leave')">
        I AM ON LEAVE
      </button>
    </div>

    <div id="status"></div>
  </div>

  <canvas id="canvas" width="400" height="300" style="display:none;"></canvas>

<script>

const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyVHXSiCmfPAY-2Cgab4KGGTqJCjdcqmcxL0ZUqzKZ7USkp5gIchLlT30Ll3cWJXEop_Q/exec";

const video = document.getElementById('video');
const workerInput = document.getElementById('workerId');
const statusBox = document.getElementById('status');

// ---------------- ID MEMORY ----------------
window.onload = () => {
  const id = localStorage.getItem('worker_id');
  if (id) workerInput.value = id;

  retryOffline();
};

// ---------------- CAMERA ----------------
navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
.then(stream => video.srcObject = stream)
.catch(() => alert("Camera permission required"));

// ---------------- STATUS ----------------
function showStatus(msg, color, bg) {
  statusBox.innerText = msg;
  statusBox.style.color = color;
  statusBox.style.background = bg;
  statusBox.style.display = "block";
}

// ---------------- MAIN ----------------
function submitAttendance(type) {

  const id = workerInput.value.trim();
  if (!id) return alert("Enter Worker ID");

  localStorage.setItem('worker_id', id);

  // ---------------- LEAVE ----------------
  if (type === "leave") {
    sendToServer({
      workerId: id,
      type: "leave"
    }, "🟡 I am on leave recorded");
    return;
  }

  showStatus("Processing...", "#1a73e8", "#e8f0fe");

  navigator.geolocation.getCurrentPosition(pos => {

    const canvas = document.getElementById('canvas');
    canvas.getContext('2d').drawImage(video, 0, 0, 400, 300);
    const selfie = canvas.toDataURL("image/jpeg", 0.6);

    const payload = {
      workerId: id,
      type: type,
      lat: pos.coords.latitude,
      lng: pos.coords.longitude,
      selfieUrl: selfie
    };

    sendToServer(payload, "✅ Submitted");

  }, () => {
    showStatus("❌ Location required", "#d93025", "#fce8e6");
  });
}

// ---------------- SERVER ----------------
function sendToServer(data, successMsg) {

  fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    mode: 'no-cors',
    body: JSON.stringify(data)
  })
  .then(() => {
    showStatus(successMsg, "#1e7e34", "#e6f4ea");
  })
  .catch(() => {
    localStorage.setItem("offline_queue", JSON.stringify(data));
    showStatus("📡 Saved offline", "#0c5460", "#d1ecf1");
  });
}

// ---------------- OFFLINE RETRY ----------------
function retryOffline() {
  const queue = localStorage.getItem("offline_queue");
  if (!queue) return;

  fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    mode: 'no-cors',
    body: queue
  }).then(() => {
    localStorage.removeItem("offline_queue");
  });
}

</script>

</body>
</html>
