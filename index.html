<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CARBON Attendance</title>
  <style>
    body { font-family: -apple-system, sans-serif; display: flex; flex-direction: column; align-items: center; background: #f4f7f9; padding: 20px; }
    .header { text-align: center; margin-bottom: 25px; width: 100%; max-width: 380px; }
    .logo { width: 100%; height: auto; max-width: 300px; display: block; margin: 0 auto; }
    .sub-text { font-size: 12px; font-weight: bold; color: #555; margin-top: 10px; letter-spacing: 1px; text-transform: uppercase; }
    .card { background: white; padding: 25px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 100%; max-width: 380px; box-sizing: border-box; }
    input { width: 100%; padding: 15px; margin-bottom: 20px; border: 1px solid #ddd; border-radius: 10px; box-sizing: border-box; font-size: 16px; outline: none; }
    .video-container { width: 100%; background: #000; border-radius: 12px; overflow: hidden; margin-bottom: 20px; aspect-ratio: 4/3; }
    video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    .btn-group { display: flex; gap: 12px; }
    button { flex: 1; padding: 18px; border: none; border-radius: 10px; color: white; font-weight: bold; cursor: pointer; transition: 0.3s; }
    #loginBtn { background: #28a745; }
    #logoutBtn { background: #dc3545; }
    #status { margin-top: 20px; padding: 12px; border-radius: 8px; font-size: 14px; text-align: center; display: none; width: 100%; }
    .offline-badge { font-size: 10px; color: orange; font-weight: bold; margin-top: 5px; display: none; }
  </style>
</head>
<body>

  <div class="header">
    <img src="https://raw.githubusercontent.com/attendancecarbon/Workers_Attendance/main/36ac2e59-7e79-49bd-af4f-bab334e60066.png" alt="Carbon Logo" class="logo">
    <div class="sub-text">CARBON ARCHITECTURE & CONTRACTING L.L.C</div>
    <div id="offlineNotify" class="offline-badge">● PENDING SYNC (OFFLINE)</div>
  </div>

  <div class="card">
    <input type="text" id="workerId" placeholder="Enter Worker ID" autocomplete="off">
    <div class="video-container">
      <video id="video" autoplay playsinline muted></video>
    </div>
    <div class="btn-group">
      <button id="loginBtn" onclick="submitAttendance('login')">CLOCK IN</button>
      <button id="logoutBtn" onclick="submitAttendance('logout')">CLOCK OUT</button>
    </div>
    <div id="status"></div>
  </div>

  <canvas id="canvas" style="display:none;" width="400" height="300"></canvas>

  <script>
    const APPS_SCRIPT_URL = "YOUR_DEPLOYED_URL_HERE"; 
    const video = document.getElementById('video');
    const workerInput = document.getElementById('workerId');
    const statusBox = document.getElementById('status');
    const offlineNotify = document.getElementById('offlineNotify');

    // --- ID Persistence ---
    window.onload = function() {
      const savedId = localStorage.getItem('carbon_worker_id');
      const savedDate = localStorage.getItem('carbon_save_date');
      const today = new Date().toDateString();
      if (savedDate !== today) { localStorage.clear(); } 
      else if (savedId) { workerInput.value = savedId; }
      checkPendingSync();
    };

    // --- Service Worker for Offline Mode ---
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }

    navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } }).then(s => video.srcObject = s);

    function showStatus(msg, color, bg) {
      statusBox.innerText = msg;
      statusBox.style.color = color;
      statusBox.style.background = bg;
      statusBox.style.display = "block";
    }

    function submitAttendance(type) {
      const id = workerInput.value.trim();
      if(!id) { alert("Please enter ID"); return; }

      localStorage.setItem('carbon_worker_id', id);
      localStorage.setItem('carbon_save_date', new Date().toDateString());

      showStatus("Acquiring GPS...", "#1a73e8", "#e8f0fe");

      navigator.geolocation.getCurrentPosition(pos => {
        const canvas = document.getElementById('canvas');
        canvas.getContext('2d').drawImage(video, 0, 0, 400, 300);
        const selfie = canvas.toDataURL('image/jpeg', 0.6);

        const attendanceData = {
          workerId: id, type: type,
          lat: pos.coords.latitude, lng: pos.coords.longitude,
          selfieUrl: selfie, timestamp: new Date().getTime()
        };

        if (navigator.onLine) {
          sendToServer(attendanceData, true);
        } else {
          saveLocally(attendanceData);
        }
      }, err => { alert("Need GPS!"); }, { enableHighAccuracy: true });
    }

    function sendToServer(data, isLive) {
      if (isLive) showStatus("Uploading to Sheets...", "#1a73e8", "#e8f0fe");
      
      fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        body: JSON.stringify(data)
      }).then(() => {
        if (isLive) {
          showStatus("✅ Success!", "#1e7e34", "#e6f4ea");
          if (data.type === 'logout') { workerInput.value = ""; localStorage.clear(); }
        }
        removeFinishedSync(data.timestamp);
      }).catch(() => {
        if (isLive) saveLocally(data);
      });
    }

    function saveLocally(data) {
      let pending = JSON.parse(localStorage.getItem('pending_sync') || "[]");
      pending.push(data);
      localStorage.setItem('pending_sync', JSON.stringify(pending));
      showStatus("☁️ Offline: Saved on Phone", "orange", "#fff3e0");
      offlineNotify.style.display = "block";
    }

    function checkPendingSync() {
      if (!navigator.onLine) return;
      let pending = JSON.parse(localStorage.getItem('pending_sync') || "[]");
      if (pending.length > 0) {
        offlineNotify.style.display = "block";
        pending.forEach(data => sendToServer(data, false));
      } else {
        offlineNotify.style.display = "none";
      }
    }

    function removeFinishedSync(ts) {
      let pending = JSON.parse(localStorage.getItem('pending_sync') || "[]");
      pending = pending.filter(item => item.timestamp !== ts);
      localStorage.setItem('pending_sync', JSON.stringify(pending));
      if (pending.length === 0) offlineNotify.style.display = "none";
    }

    setInterval(checkPendingSync, 30000); // Check every 30 seconds
  </script>
</body>
</html>
