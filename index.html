<!DOCTYPE html>
<html>
<head>
  <title>Worker Attendance</title>
</head>
<body>
  <h2>Attendance System</h2>
  
  <label>Worker ID:</label>
  <input type="text" id="workerId"><br><br>
  
  <button onclick="markAttendance('login')">Login / Clock In</button>
  <button onclick="markAttendance('logout')">Logout / Clock Out</button>
  
  <video id="video" width="320" height="240" autoplay></video>
  <canvas id="canvas" width="320" height="240" style="display:none;"></canvas>
  
  <script>
  const url = "https://script.google.com/macros/s/AKfycbxm2cfONIOklT-v1JPCXC4_lJNvkyTsSGb0cpYyLr5FdZP4Oueytfl7deEhiGl3HwHM/exec"; // Replace with your Web App URL

  navigator.mediaDevices.getUserMedia({video:true})
  .then(stream => { document.getElementById('video').srcObject = stream; })
  .catch(err => alert("Camera access denied: "+err));

  function markAttendance(type){
    const workerId = document.getElementById('workerId').value;
    if(!workerId){ alert("Enter Worker ID"); return; }
    
    const canvas = document.getElementById('canvas');
    const video = document.getElementById('video');
    canvas.getContext('2d').drawImage(video,0,0,canvas.width,canvas.height);
    const selfieUrl = canvas.toDataURL("image/jpeg",0.6);
    
    if(!navigator.geolocation){ alert("GPS not supported"); return; }
    navigator.geolocation.getCurrentPosition(pos=>{
      const data = {
        workerId: workerId,
        lat: pos.coords.latitude,
        lng: pos.coords.longitude,
        selfieUrl: selfieUrl,
        type: type
      };
      fetch(url,{
        method: 'POST',
        body: JSON.stringify(data)
      }).then(res=>res.text())
      .then(txt=>{
        alert("Attendance marked successfully!");
        window.close();
      }).catch(err=>alert("Failed to send attendance: "+err));
    },err=>alert("GPS Error: "+err.message));
  }
  </script>
</body>
</html>
